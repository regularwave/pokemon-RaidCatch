<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RaidCatch</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <header>
        <h1>RaidCatch</h1>
        <p>100% Catch Rate Finder</p>
    </header>

    <main>
        <div id="loader">
            <div class="spinner"></div>
            Loading Pokédex Data...
        </div>

        <div id="error-msg"></div>

        <div id="app-content" style="display: none;">

            <div class="search-container">
                <label for="pokemon-search">Search for a Pokémon</label>
                <div class="input-wrapper">
                    <span class="material-symbols-outlined search-icon">search</span>

                    <input type="text" id="pokemon-search" placeholder="Start typing a name..." autocomplete="off">

                    <button id="clear-btn" class="clear-btn" aria-label="Clear search" style="display: none;">
                        <span class="material-symbols-outlined">ink_eraser</span>
                    </button>

                    <ul id="dropdown-list"></ul>
                </div>
            </div>

            <div id="results-container">
                <div class="pokemon-header">
                    <h2 class="pokemon-name" id="display-name">Select a Pokémon</h2>
                </div>
                <div id="forms-container">
                </div>
            </div>

        </div>
    </main>

    <footer>
        <a href="https://github.com/regularwave/pokemon-RaidCatch" target="_blank" rel="noopener noreferrer">Report an Issue on GitHub</a>
    </footer>

    <script src="script.js" defer></script>
</body>

</html>
